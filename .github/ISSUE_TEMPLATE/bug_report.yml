name: Bug report
description: Tell us about a problem you encountered in Spudwitch
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues before submitting
        Remove personal information, private conversations, passwords and API keys from reports and screenshots
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you were trying to do
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that lead to the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Browser name and version, operating system, device
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or additional details
      description: Optional — remove private information before attaching
